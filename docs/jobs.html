<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>직업 도감</title>
<!-- 모든 직업의 1~10단계 그림을 한 장에 모아 보는 도감. jobs-male.png(남성)·jobs-female.png(여성)는 이 페이지를 캡처한 것 -->
<style>
body{margin:0;background:#141030;color:#f4f2ff;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
#wrap{width:1480px;padding:28px 28px 36px}
h1{margin:0 0 4px;font-size:30px}
.sub{color:#b9b3e6;font-size:15px;margin-bottom:22px}
h2{margin:26px 0 10px;font-size:20px;color:#ffc94d}
.row{display:flex;align-items:stretch;background:#272157;border-radius:16px;margin-bottom:10px;padding:8px 6px}
.job{width:150px;flex:0 0 150px;display:flex;flex-direction:column;justify-content:center;padding-left:10px;border-left:6px solid var(--c);border-radius:4px}
.job .ic{font-size:30px}
.job b{font-size:19px;margin-top:2px}
.job small{color:#b9b3e6;font-size:12px;margin-top:2px}
.cell{width:128px;flex:0 0 128px;text-align:center}
.cell .art{width:100px;height:118px;margin:0 auto}
.cell .art svg{width:100%;height:100%}
.cell .n{display:inline-block;font-size:11px;font-weight:800;color:#1a1530;background:var(--c);border-radius:999px;padding:0 7px;margin-top:2px}
.cell .nm{font-size:12px;line-height:1.3;color:#e8e5ff;margin-top:3px;padding:0 3px;word-break:keep-all}
.cell.last .nm{color:#ffc94d;font-weight:700}
</style>
</head>
<body>
<div id="wrap">
  <h1>레벨업 라이프 · 직업 도감</h1>
  <div class="sub" id="sub"></div>
  <div id="list"></div>
</div>
<script src="../hero.js"></script>
<script>
// jobs.html#f 로 열면 여성 버전
const g = location.hash === '#f' ? 'f' : 'm';
document.querySelector('h1').textContent += g === 'f' ? ' (여성)' : ' (남성)';
const keys = Object.keys(CLASSES);
const groups = [
  ['🧑 사람 직업 · 떠돌이 거지에서 시작', keys.filter(k => HUMAN.includes(k))],
  ['🧝 종족 직업 · 각 종족의 약한 모습에서 시작', keys.filter(k => !HUMAN.includes(k))],
];
document.getElementById('sub').textContent =
  `직업 ${keys.length}개 × 10단계 · 한 단계 = 500P · 홀수 단계에서 옷이, 짝수 단계에서 무기가 좋아져요`;
document.getElementById('list').innerHTML = groups.map(([title, ks]) => `<h2>${title} (${ks.length})</h2>` + ks.map(k => {
  const c = CLASSES[k];
  return `<div class="row" style="--c:${c.color}">
    <div class="job"><span class="ic">${c.icon}</span><b>${c.name}</b><small>최종: ${c.stages[9]}</small></div>
    ${c.stages.map((s, i) => `<div class="cell ${i === 9 ? 'last' : ''}"><div class="art">${heroSVG(k, i + 1, g)}</div>
      <span class="n">${i + 1}단계</span><div class="nm">${s}</div></div>`).join('')}
  </div>`;
}).join('')).join('');
</script>
</body>
</html>
